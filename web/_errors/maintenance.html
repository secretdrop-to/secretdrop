<style>
:root{
--bg:#1b2249;
--text:#f3f4ff;
--muted:#979dd0;
--stub:#ffd23f;

@media (prefers-color-scheme:light){

body{

color:var(--text);
background:var(--bg);
}
.wrap{
width:min(480px,calc(100% - 32px));
margin:auto;
padding:48px 0;
}
.brand{
display:inline-flex;
align-items:center;
gap:10px;
margin-bottom:40px;
color:var(--text);
text-decoration:none;
font-size:19px;
font-weight:700;
letter-spacing:-.015em;
}
.brand svg{width:28px;height:17.5px}
.brand .mark-body{fill:var(--text)}
.brand .mark-stub{fill:var(--stub)}
h1{
font-size:30px;
font-weight:800;
letter-spacing:-.025em;
line-height:1.2;
margin-bottom:12px;
}
p{color:var(--muted);font-size:16px;line-height:1.6}
</style>
</head>
